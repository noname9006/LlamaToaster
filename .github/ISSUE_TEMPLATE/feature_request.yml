name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the goal rather than the implementation — what you're trying
        to learn about a model or a machine, and where LlamaToaster currently
        gets in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
      description: A manual llama-bench invocation, a spreadsheet, another tool — anything that shows the shape of the gap.
    validations:
      required: false
