name: Test

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Workers run on Windows as much as Linux, and several paths differ there
    # (GPU counters, process listing, file locking).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            admin/package-lock.json

      # better-sqlite3 ships prebuilt binaries but also a binding.gyp, so a plain
      # `npm ci` runs node-gyp, which fails on windows-latest (its Visual Studio
      # is newer than node-gyp knows). --ignore-scripts skips that build; the
      # root postinstall hook (which installs worker/, client/ and admin/) is
      # then done by hand: `npm run postinstall` would recurse, because each
      # nested `npm install --prefix` runs the root postinstall again.
      - run: npm ci --ignore-scripts
      - run: npm run install:worker
      - run: npm ci --ignore-scripts --prefix client
      - run: npm ci --ignore-scripts --prefix admin

      # Informational: a new advisory shouldn't turn every open PR red.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Typecheck (server, worker, shared)
        run: npm run typecheck

      - run: npm test

      # Both SPAs are built from source at deploy time, so a broken build is
      # a broken release even when every test passes.
      - name: Build client SPA
        run: npm run build

      - name: Build admin SPA
        run: npm run build:admin
