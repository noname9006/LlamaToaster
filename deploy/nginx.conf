# nginx reverse proxy for LlamaToaster (MULTIUSER_PLAN.md §6.1) -- the one
# genuinely new piece of infrastructure this plan introduces. The app itself
# is unchanged by this file's existence: ONE Fastify process still serves
# both hostnames below (it tells them apart itself via req.hostname, see
# server/src/routes/admin.ts's ADMIN_HOSTNAME) -- there is no second Node
# process, no second PM2/systemd unit, just a second server{} block that
# forwards to the same backend.
#
# Caddy is an equally valid alternative (automatic HTTPS, less TLS-lifecycle
# ownership) -- see the plan's own §6.1 for the equivalent Caddyfile shape.
# Use this file if you already run nginx for anything else on the box: one
# front door beats running two reverse proxies side by side.
#
# BEFORE using this file:
#   1. Replace llamatoaster.com / supervise.llamatoaster.com below with your
#      real domain(s) -- these are placeholders, matching the examples used
#      throughout this codebase's own comments (ADMIN_PUBLIC_URL etc.), not
#      a real registered domain this repo owns.
#   2. Match `proxy_pass http://127.0.0.1:<port>` to whatever PORT is
#      actually set in deploy/orchestrator.env (default 3000; this
#      deployment's real orchestrator.env may use a different one).
#   3. BIND_HOST in orchestrator.env must become 127.0.0.1 -- the app should
#      not be reachable on any public interface directly, only nginx on
#      80/443. Confirm with the VPS firewall (ufw/iptables), not just by
#      trusting the bind address.
#   4. Run `certbot --nginx -d llamatoaster.com -d supervise.llamatoaster.com`
#      once (both hostnames, one cert) after this config is live, then verify
#      its systemd timer (certbot.timer) actually renews before relying on it.
#   5. server/src/index.ts registers trustProxy scoped to 127.0.0.1/::1 --
#      this file's `proxy_set_header X-Forwarded-For` is what that reads;
#      without both halves, per-IP rate limits (§2.6) silently collapse into
#      one shared global limit since every request would otherwise look like
#      it came from nginx's own loopback address.

server {
    listen 443 ssl http2;
    server_name llamatoaster.com;

    ssl_certificate     /etc/letsencrypt/live/llamatoaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llamatoaster.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # img-src allowlists each linked OAuth provider's avatar CDN individually
    # (GitHub shown; extend this when a second PROVIDERS entry, e.g. Google's
    # lh3.googleusercontent.com, is added -- MULTIUSER_PLAN.md §2.4) -- or
    # proxy avatars server-side and drop the allowlist entirely.
    # style-src 'unsafe-inline' is required by the current Tailwind build --
    # remove it if the build is switched to extracted CSS.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://avatars.githubusercontent.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # >= the 25s worker long-poll (MULTIUSER_PLAN.md §1.4) -- an nginx
        # default (60s) is fine too, but state it explicitly rather than
        # relying on the default surviving a future nginx upgrade unchanged.
        proxy_read_timeout 35s;
    }
}
server {
    listen 80;
    server_name llamatoaster.com;
    return 301 https://$host$request_uri;
}

# supervise.llamatoaster.com (MULTIUSER_PLAN.md §5.1) -- SAME backend,
# 127.0.0.1:3000. This block only needs to exist and forward; the app itself
# does every bit of the actual gating (hostname check, superadmin check) once
# a request with this Host header reaches it.
server {
    listen 443 ssl http2;
    server_name supervise.llamatoaster.com;

    ssl_certificate     /etc/letsencrypt/live/llamatoaster.com/fullchain.pem;   # -d for both hostnames, one cert
    ssl_certificate_key /etc/letsencrypt/live/llamatoaster.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tighter than the main site's CSP: no avatar images, no AI chat, no
    # third-party embeds at all in the deliberately minimal admin SPA.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name supervise.llamatoaster.com;
    return 301 https://$host$request_uri;
}
