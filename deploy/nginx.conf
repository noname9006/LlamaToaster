# nginx reverse proxy for LlamaToaster (MULTIUSER_PLAN.md §6.1). The one
# config for this deployment -- the old nginx.llamatoaster.com.conf copy
# drifted from it (different port), so it was folded in here.
#
# ONE Fastify process serves both hostnames below; it tells them apart itself
# by the Host header (server/src/routes/admin.ts's isAdminHost). There is no
# second Node process, just a second server{} block forwarding to the same
# backend.
#
# Deploy:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/llamatoaster
#   sudo ln -s /etc/nginx/sites-available/llamatoaster /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d llamatoaster.com -d supervise.llamatoaster.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adapting it:
#   1. Replace llamatoaster.com / supervise.llamatoaster.com with your domain(s).
#   2. `proxy_pass http://127.0.0.1:4010` must match PORT in
#      deploy/orchestrator.env (4010 on this deployment; the example file's
#      default is 3000).
#   3. BIND_HOST in orchestrator.env must be 127.0.0.1 -- the app should be
#      reachable only through nginx. Confirm with the firewall too.
#   4. After certbot, check its renewal timer (certbot.timer) actually runs.
#   5. server/src/index.ts trusts X-Forwarded-For only from 127.0.0.1/::1, so
#      per-IP rate limits (§2.6) depend on nginx setting it here.
#   6. X-Forwarded-Host is blanked: with trustProxy on loopback the app would
#      otherwise believe whatever a client puts there (audit 2026-09-27 M1).
#      The app no longer reads it for the admin gate either; this is the
#      second layer.
#
# To DISABLE the admin surface: delete the supervise.* server blocks and leave
# ADMIN_PUBLIC_URL unset in orchestrator.env (every /api/admin/* route 404s).

server {
    listen 443 ssl http2;
    server_name llamatoaster.com;

    ssl_certificate     /etc/letsencrypt/live/llamatoaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llamatoaster.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # img-src allowlists each linked OAuth provider's avatar CDN individually
    # (GitHub shown; extend this when a second provider is added --
    # MULTIUSER_PLAN.md §2.4). style-src 'unsafe-inline' is required by the
    # current Tailwind build.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://avatars.githubusercontent.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # The app's largest bodies: result imports (8 MB, routes/exchange.ts) and
    # run log uploads (5 MB, routes/tests.ts). nginx's 1 MB default would 413
    # them (audit 2026-09-27 M4).
    client_max_body_size 10m;

    # Inherited by every location below (a location that sets any
    # proxy_set_header of its own would drop all of these).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";

    location / {
        proxy_pass http://127.0.0.1:4010;
        # >= the 25s worker long-poll (MULTIUSER_PLAN.md §1.4).
        proxy_read_timeout 35s;
    }

    # The AI assistant streams SSE, but sends nothing until its tool rounds
    # finish (up to 4, each with up to 15s of Hugging Face lookups on top of
    # the model call), so it needs a longer read timeout, and no buffering so
    # the reply arrives as it's written. The route also sends
    # X-Accel-Buffering: no.
    location = /api/ai/chat {
        proxy_pass http://127.0.0.1:4010;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
server {
    listen 80;
    server_name llamatoaster.com;
    return 301 https://$host$request_uri;
}

# supervise.llamatoaster.com (MULTIUSER_PLAN.md §5.1) -- SAME backend. This
# block only forwards; the app does all of the gating (Host check, superadmin
# check) itself.
server {
    listen 443 ssl http2;
    server_name supervise.llamatoaster.com;

    ssl_certificate     /etc/letsencrypt/live/llamatoaster.com/fullchain.pem;   # one cert for both hostnames
    ssl_certificate_key /etc/letsencrypt/live/llamatoaster.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tighter than the main site's CSP: no avatar images, no AI chat.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";

    location / {
        proxy_pass http://127.0.0.1:4010;
    }
}
server {
    listen 80;
    server_name supervise.llamatoaster.com;
    return 301 https://$host$request_uri;
}
