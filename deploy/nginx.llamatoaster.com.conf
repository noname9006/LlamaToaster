# nginx reverse proxy for LlamaToaster -- adapted for llamatoaster.com.
# Deploy: sudo cp this to /etc/nginx/sites-available/llamatoaster
#         sudo ln -s .../sites-available/llamatoaster .../sites-enabled/
# Then: sudo certbot --nginx -d llamatoaster.com -d supervise.llamatoaster.com
#       sudo nginx -t && sudo systemctl reload nginx
#
# App listens on 127.0.0.1:4010 (PORT=4010 in orchestrator.env, BIND_HOST=127.0.0.1).
# server/src/index.ts trusts X-Forwarded-For ONLY from 127.0.0.1/::1, so nginx
# MUST forward from loopback -- which it does here.
#
# To DISABLE the admin surface: delete the supervise.* server blocks and leave
# ADMIN_PUBLIC_URL unset in orchestrator.env (every /api/admin/* route then 404s).

server {
    listen 443 ssl http2;
    server_name llamatoaster.com;

    ssl_certificate     /etc/letsencrypt/live/llamatoaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llamatoaster.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://avatars.githubusercontent.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # >= the 25s worker long-poll
        proxy_read_timeout 35s;
    }
}
server {
    listen 80;
    server_name llamatoaster.com;
    return 301 https://$host$request_uri;
}

# Optional superadmin surface -- SAME backend (127.0.0.1:4010).
server {
    listen 443 ssl http2;
    server_name supervise.llamatoaster.com;

    ssl_certificate     /etc/letsencrypt/live/llamatoaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llamatoaster.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name supervise.llamatoaster.com;
    return 301 https://$host$request_uri;
}
